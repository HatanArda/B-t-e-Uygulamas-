# Her güncellemede uygulamayı test edip derler ve GitHub Pages'e (gh-pages dalı) yayınlar.
# Adres: https://hatanarda.github.io/B-t-e-Uygulamas-/
name: Yayinla

on:
  workflow_dispatch:
  push:
    branches: ["claude/turkish-budget-pwa-5qu18y", "main"]
    paths-ignore: ["**.md"]

permissions:
  contents: write

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE: /B-t-e-Uygulamas-/
      - name: gh-pages dalina gonder
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Yayin ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
